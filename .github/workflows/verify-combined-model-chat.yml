name: Verify live model-generated conversation
on:
  push:
    paths: ['.github/workflows/verify-combined-model-chat.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify production model and real conversation routing
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://infini-eta.vercel.app'
          for attempt in range(50):
              try:
                  page = urllib.request.urlopen(base + '/?mode=combined', timeout=30).read().decode()
                  model = json.load(urllib.request.urlopen(base + '/api/llm/status?check=224813', timeout=180))['model']
                  if 'Conversation is generated by Infinity LLM' in page and model.get('available') and model.get('version') == 'books75m-step224813' and model.get('selfTest',{}).get('ok'): break
                  print('Waiting for model:', model.get('version'), model.get('available'), flush=True)
              except Exception as e: print('Waiting for production:', e, flush=True)
              time.sleep(10)
          else: raise RuntimeError('new deployment or pinned model not ready')
          assert model['parameters'] == 74727168 and model['trainedSteps'] == 224813 and model['trainedTokens'] == 28776064
          def ask(q):
              body = json.dumps({'question':q, 'settings':{'mode':'combined', 'depth':'balanced'}}).encode()
              req = urllib.request.Request(base+'/api/ask', data=body, headers={'Content-Type':'application/json'})
              start=time.monotonic()
              with urllib.request.urlopen(req, timeout=250) as r: events=[json.loads(x) for x in r.read().decode().splitlines() if x.strip()]
              assert not [e for e in events if e['type']=='error'], events
              result=next(e['result'] for e in events if e['type']=='answer')
              return result, events, round(time.monotonic()-start, 2)
          rows=[]
          for q in ['Hi', 'Hello!', 'How are you?', 'Thank you!', 'Can you assist me?']:
              r,events,secs=ask(q)
              assert r['combined']['mode']=='chat' and r['neural']['used'] and r['neural']['model']['version']=='books75m-step224813', r
              assert not r['sources'] and not [e for e in events if e['type']=='search'], events
              tokens=''.join(e.get('text','') for e in events if e['type']=='token')
              assert tokens.strip() == r['answer']['blocks'][0]['spans'][0]['text'].strip(), (tokens,r)
              rows.append({'question':q,'seconds':secs,'answer':r['answer']['text'],'combined':r['combined'],'neural':r['neural'],'sources':r['sources']})
          q='Hi, what is the capital of Nepal?'; r,events,secs=ask(q)
          assert r['kind']=='retrieval' and r['combined']['mode']=='web' and r['sources'] and 'Kathmandu' in r['answer']['text'],r
          assert not [e for e in events if e['type']=='token']
          rows.append({'question':q,'seconds':secs,'answer':r['answer']['text'],'combined':r['combined'],'sources':[{'title':s['title'],'url':s['url']} for s in r['sources']]})
          with open('combined-model-chat-live.json','w') as f: json.dump({'model':model,'results':rows},f,indent=2)
          print(json.dumps({'model':model['version'],'results':rows},indent=2))
          PY
          gh release upload infinity-qa75m-43850778510 --repo "$GITHUB_REPOSITORY" combined-model-chat-live.json --clobber
