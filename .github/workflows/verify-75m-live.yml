name: Verify live 75M Infini
on:
  push:
    paths: ['.github/workflows/verify-75m-live.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check production version and raw responses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://infini-eta.vercel.app'
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(base + '/api/llm/status?check=qa75m-starter', timeout=180) as r:
                      status = json.load(r)
                  model = status['model']
                  if model.get('available') and model.get('version') == 'qa75m-step500' and model.get('selfTest', {}).get('ok'):
                      break
                  print('Waiting for live 75M:', model.get('version'), model.get('available'), flush=True)
              except Exception as e:
                  print('Waiting for production:', str(e), flush=True)
              time.sleep(15)
          else:
              raise RuntimeError('75M model did not become ready')
          assert model['parameters'] == 74727168, model
          results = []
          for question in ['Hello!', 'What is your name?', 'How are you?']:
              body = json.dumps({'message': question, 'history': [], 'temperature': 0, 'seed': 1, 'maxTokens': 40}).encode()
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(base + '/api/llm/chat', data=body, headers={'Content-Type': 'application/json', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=180) as r:
                          events = [json.loads(line) for line in r.read().decode().splitlines() if line.strip()]
                      start = next(e for e in events if e['type'] == 'start')
                      answer = next(e for e in events if e['type'] == 'answer')
                      assert start['model']['version'] == 'qa75m-step500' and answer['ok']
                      results.append({'question': question, 'text': answer['text'], 'finished': answer['finished'], 'model': start['model']['version']})
                      break
                  except Exception:
                      if attempt == 3: raise
                      time.sleep(8)
              time.sleep(3)
          with open('live-75m.json', 'w') as f:
              json.dump({'status': model, 'temperature': 0, 'seed': 1, 'results': results}, f, indent=2)
          print(json.dumps(results, indent=2))
          PY
          gh release upload infinity-qa75m-43662976189 --repo "$GITHUB_REPOSITORY" live-75m.json --clobber
