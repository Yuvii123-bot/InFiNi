name: Verify Web plus LLM in production
on:
  push:
    paths: ['.github/workflows/verify-combined-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check mode, pinned model, retrieval and fallback
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://infini-eta.vercel.app'
          for attempt in range(30):
              try:
                  page = urllib.request.urlopen(base + '/?mode=combined', timeout=30).read().decode()
                  if 'id="modeCombined"' in page: break
              except Exception as e: print('Waiting for deployment:', e, flush=True)
              time.sleep(10)
          else: raise RuntimeError('combined mode not deployed')
          assert 'Infinity LLM' in page and 'Internet AI' in page
          for attempt in range(30):
              try:
                  model = json.load(urllib.request.urlopen(base + '/api/llm/status', timeout=180))['model']
                  if model.get('available') and model.get('version') == 'books75m-step111248': break
                  print('Waiting for model:', model.get('version'), model.get('available'), flush=True)
              except Exception as e: print('Waiting for model:', e, flush=True)
              time.sleep(10)
          else: raise RuntimeError('pinned 75M model not ready')
          def ask(question):
              body = json.dumps({'question': question, 'settings': {'mode': 'combined', 'depth': 'fast'}}).encode()
              req = urllib.request.Request(base + '/api/ask', data=body, headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=250) as r:
                  events = [json.loads(line) for line in r.read().decode().splitlines() if line.strip()]
              assert not [e for e in events if e['type'] == 'error'], events
              return next(e['result'] for e in events if e['type'] == 'answer')
          calc = ask('what is 2+2')
          assert calc['combined']['used'] is False and '4' in calc['answer']['text']
          result = ask('What is the capital of Nepal?')
          combined = result['combined']
          if combined['used']:
              assert result['neural']['model']['version'] == 'books75m-step111248'
              assert result['neural']['mode'] == 'highlight'
              spans = [s for b in result['answer']['blocks'] for s in b.get('spans', [])] + [s for b in result['answer']['blocks'] for it in b.get('items', []) for s in it.get('spans', [])]
              selected = [s for s in spans if s.get('neuralHighlight')]
              assert len(selected) == 1 and selected[0].get('cites')
          else:
              assert combined.get('reason')
          print(json.dumps({'model': model['version'], 'combined': combined, 'sources': len(result['sources']), 'answer': result['answer']['text'][:500]}, indent=2))
          PY
