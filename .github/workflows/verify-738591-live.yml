name: Verify 738591 production model and visible web output
on:
  push:
    paths: ['.github/workflows/verify-738591-live.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Test production after the new interface is promoted
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://infini-eta.vercel.app'
          for _ in range(50):
              try:
                  page = urllib.request.urlopen(base + '/?mode=webinllm', timeout=30).read().decode()
                  model = json.load(urllib.request.urlopen(base + '/api/llm/status?check=738591', timeout=60))['model']
                  if 'unmatched answers are shown without citations' in page and model.get('version') == 'books75m-step738591' and model.get('selfTest', {}).get('ok'): break
              except Exception as e: print('Waiting:', str(e), flush=True)
              time.sleep(10)
          else: raise RuntimeError('new deployment or model not ready')
          def ask(question):
              data = json.dumps({'question':question,'settings':{'mode':'webinllm','depth':'balanced'},'regenerate':True}).encode()
              req = urllib.request.Request(base + '/api/ask',data=data,headers={'Content-Type':'application/json'})
              start=time.monotonic()
              with urllib.request.urlopen(req,timeout=250) as response: events=[json.loads(line) for line in response.read().decode().splitlines() if line.strip()]
              assert not [e for e in events if e.get('type')=='error'],events
              return next(e['result'] for e in events if e.get('type')=='answer'),events,round(time.monotonic()-start,2)
          rows=[]
          for q in ['Hi', 'What is the capital of Nepal?', 'Can penguins fly?']:
              r,events,seconds=ask(q)
              c,n=r.get('combined',{}),r.get('neural',{})
              if q=='Hi':
                  assert c.get('mode')=='chat' and n.get('used') and not r['sources'] and not [e for e in events if e.get('type')=='search'],r
              else:
                  assert r['kind']=='retrieval' and c.get('mode')=='web-synthesis' and n.get('used') and n.get('model',{}).get('version')=='books75m-step738591',r
                  assert 'could not produce a sufficiently supported answer' not in r['answer']['text'],r
                  assert not [e for e in events if e.get('type') in ('draft','token')],events
                  assert 'Web findings' not in r['answer']['text'] and 'Excerpts sent' not in r['answer']['text'],r
                  if not n.get('cited'):
                      assert not r['sources'] and 'Unverified model answer' in r['answer']['text'],r
                  else: assert r['sources'] and 'not independently fact-checked' in r['answer']['text'],r
              rows.append({'question':q,'seconds':seconds,'answer':r['answer']['text'],'combined':c,'neural':n,'sourceCount':len(r['sources'])})
          with open('production-web-output.json','w') as f: json.dump({'model':model['version'],'results':rows},f,indent=2)
          print(json.dumps({'model':model['version'],'results':rows},indent=2))
          PY
          gh release upload infinity-qa75m-44428577193 --repo "$GITHUB_REPOSITORY" production-web-output.json --clobber
