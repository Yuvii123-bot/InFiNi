name: Verify improved combined mode in production
on:
  push:
    paths: ['.github/workflows/verify-combined-improved.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify model and exercise real chat, retrieval and follow-up
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://infini-eta.vercel.app'
          for attempt in range(40):
              try:
                  page = urllib.request.urlopen(base + '/?mode=combined', timeout=30).read().decode()
                  model = json.load(urllib.request.urlopen(base + '/api/llm/status?check=111248', timeout=180))['model']
                  if 'Chat locally or search the web' in page and model.get('available') and model.get('version') == 'books75m-step111248' and model.get('selfTest',{}).get('ok'): break
                  print('Waiting for model:', model.get('version'), model.get('available'), flush=True)
              except Exception as e: print('Waiting for production:', e, flush=True)
              time.sleep(10)
          else: raise RuntimeError('new deployment or pinned model not ready')
          assert model['parameters'] == 74727168 and model['trainedSteps'] == 111248 and model['trainedTokens'] == 14239744
          def ask(q, context=None):
              body = json.dumps({'question':q, 'context':context or {}, 'settings':{'mode':'combined', 'depth':'balanced'}}).encode()
              req = urllib.request.Request(base+'/api/ask', data=body, headers={'Content-Type':'application/json'})
              start=time.monotonic()
              with urllib.request.urlopen(req, timeout=250) as r: events=[json.loads(x) for x in r.read().decode().splitlines() if x.strip()]
              assert not [e for e in events if e['type']=='error'], events
              result=next(e['result'] for e in events if e['type']=='answer')
              if result['kind']=='retrieval': assert not [e for e in events if e['type']=='token']
              return result, round(time.monotonic()-start, 2)
          def summarize(q, r, seconds):
              return {'question':q, 'seconds':seconds, 'kind':r['kind'], 'combined':r.get('combined'), 'neural':r.get('neural'), 'answer':r['answer'], 'interpretation':r.get('interpretation'), 'sources':[{'id':s['id'],'title':s['title'],'url':s['url'],'published':s.get('published')} for s in r.get('sources',[])]}
          rows=[]
          q='Hello, how are you?'; r,secs=ask(q); assert r['kind']=='brain', r; rows.append(summarize(q,r,secs))
          q='What is the capital of Nepal?'; r,secs=ask(q); assert r['kind']=='retrieval' and r['sources'] and 'Kathmandu' in r['answer']['text'], r
          if r['combined']['used']:
              assert r['neural']['mode']=='highlight' and r['neural']['model']['version']==model['version']
              spans=[]
              for block in r['answer']['blocks']:
                  spans.extend(block.get('spans',[]))
                  for item in block.get('items',[]): spans.extend(item.get('spans',[]))
              selected=[s for s in spans if s.get('neuralHighlight')]
              assert len(selected)==1 and selected[0]['cites']
              assert any(p['text']==selected[0]['text'] and p['source'] in selected[0]['cites'] for p in r['research']['passages'])
          rows.append(summarize(q,r,secs)); ctx=r['context']
          q='What is its population?'; r,secs=ask(q,ctx); assert 'Kathmandu' in r.get('interpretation',{}).get('resolved',''),r; rows.append(summarize(q,r,secs))
          for q in ['What causes seasons on Earth?', 'What are the latest NASA Artemis mission updates?']:
              r,secs=ask(q); rows.append(summarize(q,r,secs))
              if 'latest' in q and r.get('sources'): assert any(b.get('tone')=='warn' for b in r['answer']['blocks'])
          with open('combined-improved-live.json','w') as f: json.dump({'model':model['version'],'results':rows},f,indent=2)
          print(json.dumps({'model':model['version'],'results':[{k:v for k,v in row.items() if k not in ('answer','sources')} for row in rows]},indent=2))
          PY
          gh release upload infinity-qa75m-43788993113 --repo "$GITHUB_REPOSITORY" combined-improved-live.json --clobber
