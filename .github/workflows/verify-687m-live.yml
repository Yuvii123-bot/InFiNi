name: Verify 68.7M-position model in production
on:
  push:
    paths: ['.github/workflows/verify-687m-live.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify model identity and live behavior
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'https://infini-eta.vercel.app'
          for _ in range(60):
              try:
                  model = json.load(urllib.request.urlopen(base + '/api/llm/status?check=536897', timeout=60))['model']
                  if model.get('version') == 'books75m-step536897' and model.get('available') and model.get('selfTest',{}).get('ok'): break
                  print('Waiting for model:',model.get('version'),model.get('available'),flush=True)
              except Exception as e: print('Waiting:', str(e), flush=True)
              time.sleep(10)
          else: raise RuntimeError('new deployment or pinned model not ready')
          assert model['parameters'] == 74727168 and model['trainedSteps'] == 536897 and model['trainedTokens'] == 68722816, model
          def ask(q, mode):
              body=json.dumps({'question':q,'settings':{'mode':mode,'depth':'balanced'}}).encode()
              req=urllib.request.Request(base+'/api/ask',data=body,headers={'Content-Type':'application/json'})
              start=time.monotonic()
              with urllib.request.urlopen(req,timeout=250) as r: events=[json.loads(x) for x in r.read().decode().splitlines() if x.strip()]
              assert not [e for e in events if e['type']=='error'], events
              return next(e['result'] for e in events if e['type']=='answer'), events, round(time.monotonic()-start,2)
          rows=[]
          for mode,q in [('combined','Hi'),('combined','How are you?'),('combined','What is the capital of Nepal?'),('webinllm','What is the capital of Nepal?')]:
              r,events,seconds=ask(q,mode)
              c,n=r.get('combined',{}),r.get('neural',{})
              if q in ('Hi','How are you?'):
                  assert c.get('mode')=='chat' and n.get('used') and n['model']['version']=='books75m-step536897',r
                  assert not r['sources'] and not [e for e in events if e['type']=='search'],r
              elif mode=='combined':
                  assert r['kind']=='retrieval' and c.get('mode')=='web' and r['sources'] and 'Kathmandu' in r['answer']['text'],r
              else:
                  assert r['kind']=='retrieval' and c.get('mode') in ('web-error','web-synthesis'),r
                  assert 'Web findings' not in r['answer']['text'] and 'Excerpts sent to the model' not in r['answer']['text'],r
                  assert not [e for e in events if e['type'] in ('draft','token')],events
                  if c.get('mode')=='web-synthesis':
                      assert n['model']['version']=='books75m-step536897' and r['sources'],r
                  else: assert not r['sources'] and 'could not' in r['answer']['text'],r
              rows.append({'mode':mode,'question':q,'seconds':seconds,'answer':r['answer']['text'],'combined':c,'neural':n,'sourceCount':len(r['sources'])})
          with open('production-536897.json','w') as f: json.dump({'model':model,'results':rows},f,indent=2)
          print(json.dumps({'model':model['version'],'results':rows},indent=2))
          PY
          gh release upload infinity-qa75m-44205300285 --repo "$GITHUB_REPOSITORY" production-536897.json --clobber
