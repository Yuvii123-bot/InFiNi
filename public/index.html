<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="INFINI AI — a chat assistant with Infinity LLM, its own small neural language model trained from scratch, live web retrieval with citations for facts, and deep research runs that read hundreds of pages. No outside language model.">
<title>INFINI AI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Conversations">
    <div class="brand"><img class="brand-mark" src="/icons/icon.svg" width="30" height="30" alt=""><span class="brand-name">INFINI<span>AI</span></span></div>
    <button id="newChat" class="btn primary block" type="button"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <label class="search"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg><input id="histSearch" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations"></label>
    <nav id="chatList" aria-label="Chat history"></nav>
    <a id="openPureSide" class="side-pure" href="/llm.html"><span class="side-pure-dot" aria-hidden="true"></span><span><b>Infinity LLM chat</b><small>Only the neural model replies</small></span></a>
    <div class="side-foot">
      <button id="openSettings" class="link-btn" type="button"><svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></svg>Settings</button>
      <a id="openLearning" class="link-btn" href="/learning.html"><svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>Learning</a>
      <button id="openAbout" class="link-btn" type="button"><svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5v.5"/></svg>About</button>
    </div>
  </aside>
  <div id="scrim" hidden></div>
  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Open conversations"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <h1 id="chatTitle">New chat</h1>
      <nav class="mode-switch" id="modeSwitch" aria-label="Chat mode">
        <a class="on" href="/" aria-current="page" title="Internet AI: answers from live web pages, with sources">Internet AI</a>
        <a id="openPure" href="/llm.html" title="Infinity LLM: a separate chat where only the neural model replies">Infinity LLM</a>
      </nav>
      <button id="clearBtn" class="icon-btn" type="button" title="Clear this conversation" aria-label="Clear this conversation"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20h13M5.5 13.5l8-8a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11.5 20H8l-2.5-2.5a2 2 0 0 1 0-2.8z"/></svg></button>
      <button id="newChatTop" class="icon-btn" type="button" title="New chat" aria-label="New chat"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5H5v14h14v-7M18.4 3.6a2 2 0 0 1 2.8 2.8L12 15.6l-3.5.9.9-3.5z"/></svg></button>
    </header>
    <div id="scroll"><div id="thread" aria-live="polite"></div></div>
    <footer id="composer">
      <form id="askForm" autocomplete="off">
        <textarea id="q" rows="1" maxlength="600" placeholder="Message INFINI AI" aria-label="Your message"></textarea>
        <div class="composer-bar" id="composerBar">
          <button id="depthBtn" class="chip-btn" type="button" title="Search depth — how far to search for each answer" aria-label="Search depth" aria-haspopup="menu" aria-expanded="false"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z"/></svg><span class="depth-word">Depth</span><span id="depthLabel">Auto</span></button>
          <span class="composer-hint">Own brain for chat · live web for facts</span>
          <button id="sendBtn" class="send" type="submit" aria-label="Send"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          <button id="stopBtn" class="send stop" type="button" aria-label="Stop retrieval" hidden><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg></button>
        </div>
      </form>
      <p class="fineprint">Chat comes from a built-in brain. Facts come from pages retrieved just now — check the citations.</p>
    </footer>
  </main>
  <aside id="drawer" hidden aria-label="Details"><div class="drawer-head"><h2 id="drawerTitle"></h2><button id="drawerClose" class="icon-btn" type="button" aria-label="Close"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="drawerBody"></div></aside>
  <div id="modal" hidden role="dialog" aria-modal="true"><div class="modal-card"><div class="drawer-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn" type="button" aria-label="Close"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="modalBody"></div></div></div>
  <div id="toast" role="status" hidden></div>
</div>
<noscript><p class="noscript">INFINI AI needs JavaScript in the browser for its interface. The engine itself can also be used from the command line: <code>node cli.js "your question"</code>.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
