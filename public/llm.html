<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Infinity LLM, pure neural chat: every reply is generated token by token by INFINI AI's own small neural language model. No web search, no rules, no outside model.">
<title>Infinity LLM · pure neural chat</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/llm.css">
</head>
<body class="pure">
<div id="pure">
  <header class="p-top">
    <a class="p-brand" href="/" aria-label="INFINI AI home"><img src="/icons/icon.svg" width="28" height="28" alt=""><span class="p-brand-name">INFINI<b>AI</b></span></a>
    <nav class="mode-switch" aria-label="Chat mode">
      <a href="/" title="Internet AI: answers from live web pages, with sources">Internet AI</a>
      <a class="on" href="/llm.html" aria-current="page" title="Infinity LLM: replies from the neural model only">Infinity LLM</a>
    </nav>
    <button id="pNew" class="btn small p-new" type="button" title="Start a new chat (clears the context)"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span></button>
  </header>
  <div class="p-banner" id="pBanner" role="note">
    <span class="p-badge">Neural only</span>
    <span><span id="pModel">Loading the model's details…</span><span class="p-banner-more"> · every word below is generated by this network</span></span>
  </div>
  <div id="pScroll"><div id="pThread" aria-live="polite"></div></div>
  <footer class="p-composer">
    <form id="pForm" class="p-box" autocomplete="off">
      <textarea id="pInput" rows="1" maxlength="2000" placeholder="Message Infinity LLM" aria-label="Message Infinity LLM" enterkeyhint="send"></textarea>
      <div class="p-bar">
        <label class="p-temp" for="pTemp" title="How much the model varies its choice of each next word. 0 always takes the most likely word."><span>Variety</span><input id="pTemp" type="range" min="0" max="12" step="1" value="6"><output id="pTempOut">0.6</output></label>
        <span id="pCtx" class="p-ctx"></span>
        <button id="pSend" class="send" type="submit" aria-label="Send"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button id="pStop" class="send stop" type="button" aria-label="Stop generating" hidden><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg></button>
      </div>
    </form>
    <p class="fineprint" id="pFine">Only the neural model answers here: no web search, no prepared replies, no outside model. It is very small and is often wrong.</p>
  </footer>
</div>
<script src="/llm.js" type="module"></script>
</body>
</html>
